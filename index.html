<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeroServer — kirim file langsung, tanpa server</title>
<meta name="description" content="ZeroServer: kirim file dari browser ke browser, langsung. Tanpa akun, tanpa upload ke server, tanpa batas ukuran dari layanan.">
<meta property="og:title" content="ZeroServer">
<meta property="og:description" content="Send files straight from one browser to another. No file server, no account, no size limit set by a service.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://ptraaah.github.io/zeroserver/assets/cover.webp">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ZeroServer">
<meta name="twitter:description" content="Send files straight from one browser to another. No file server, no account, no size limit set by a service.">
<meta name="twitter:image" content="https://ptraaah.github.io/zeroserver/assets/cover.webp">
<style>
  :root{
    --orange:#ea580c; --orange-soft:#fff3e8; --ink:#1c1917; --muted:#78716c;
    --line:#e7e0d8; --card:#ffffff; --bg:#faf7f3; --ok:#15803d; --bad:#b91c1c;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
  .wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 14px}
  .logo{font-size:30px;font-weight:800;letter-spacing:-.5px;cursor:pointer;user-select:none}
  .logo .dot{color:var(--orange)}
  .langtog{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
  .langtog button{border:0;background:#fff;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
  .langtog button.on{background:var(--orange);color:#fff}
  .tagline{font-size:15px;color:var(--muted);margin:0 2px 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;margin-bottom:14px}
  .honest{background:var(--orange-soft);border:1px solid #f3d9c4;border-radius:var(--radius);padding:12px 14px;font-size:14px;margin-bottom:14px}
  .honest p{margin:4px 0}
  .drop{border:2px dashed #d8cfc4;border-radius:var(--radius);padding:26px 14px;text-align:center;color:var(--muted);background:#fffdfb}
  .drop.over{border-color:var(--orange);background:var(--orange-soft);color:var(--ink)}
  .drop .big{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:4px}
  button.btn{appearance:none;border:0;border-radius:12px;background:var(--orange);color:#fff;font-size:16px;font-weight:700;padding:13px 18px;width:100%;cursor:pointer}
  button.btn:disabled{background:#d6cec5;cursor:not-allowed}
  button.btn.ghost{background:#fff;color:var(--orange);border:1.5px solid var(--orange)}
  button.btn.small{width:auto;font-size:14px;padding:9px 14px}
  .rowline{display:flex;gap:8px;align-items:center}
  .rowline .grow{flex:1}
  input.linkbox{width:100%;font-size:14px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fbf9f6;color:var(--ink)}
  ul.files{list-style:none;margin:10px 0;padding:0}
  ul.files li{padding:9px 2px;border-bottom:1px solid var(--line)}
  ul.files li:last-child{border-bottom:0}
  .fname{font-weight:600;font-size:15px;word-break:break-all}
  .fmeta{font-size:13px;color:var(--muted)}
  .bar{height:10px;background:#f0e9e1;border-radius:99px;overflow:hidden;margin-top:7px}
  .bar > div{height:100%;width:0%;background:var(--orange);transition:width .25s}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;margin-left:8px;vertical-align:middle}
  .badge.ok{background:#e7f6ec;color:var(--ok)}
  .badge.bad{background:#fdeaea;color:var(--bad)}
  .badge.wait{background:#f0e9e1;color:var(--muted)}
  .status{font-size:15px;font-weight:600;margin:8px 0}
  .sub{font-size:13.5px;color:var(--muted)}
  .qrbox{display:flex;justify-content:center;padding:12px 0 4px}
  .qrbox svg{max-width:220px;height:auto}
  .warn{background:#fdf3e3;border:1px solid #eed9ae;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
  .err{background:#fdeaea;border:1px solid #f0bcbc;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;color:#7f1d1d}
  .diag{font-size:13.5px}
  .diag table{width:100%;border-collapse:collapse}
  .diag td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top}
  .diag td.k{color:var(--muted);width:42%}
  .diag td.v{font-weight:600;text-align:right;word-break:break-all}
  .diag tr:last-child td{border-bottom:0}
  .hidden{display:none !important}
  footer.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}
  footer.foot a{color:var(--orange);text-decoration:none;font-weight:600}
  footer.foot a:hover{text-decoration:underline}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#1c1917;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  h2.sec{font-size:17px;margin:2px 0 8px}
  .dlbtn{margin-top:6px}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="logo" id="logo">Zero<span class="dot">Server</span></div>
    <div class="langtog">
      <button id="lang-id" class="on" type="button">ID</button>
      <button id="lang-en" type="button">EN</button>
    </div>
  </header>
  <p class="tagline" data-i18n="tagline"></p>

  <div class="honest">
    <p data-i18n="honest1"></p>
    <p data-i18n="honest2"></p>
    <p data-i18n="honest3"></p>
    <p data-i18n="honest4"></p>
  </div>

  <div class="warn hidden" id="wvBanner">
    <p style="margin:0 0 8px" data-i18n="wvText"></p>
    <button class="btn ghost small" id="wvCopy" type="button"><span data-i18n="copyLink"></span></button>
  </div>

  <!-- ============ SENDER VIEW ============ -->
  <section id="view-send">
    <div class="card">
      <div class="drop" id="dropzone">
        <div class="big" data-i18n="dropTitle"></div>
        <div data-i18n="dropHint"></div>
        <div style="margin-top:14px">
          <button class="btn small" id="pickBtn" type="button"><span data-i18n="pickBtn"></span></button>
          <button class="btn ghost small" id="pickFolderBtn" type="button" style="margin-left:8px"><span data-i18n="pickFolder"></span></button>
        </div>
      </div>
      <input type="file" id="fileInput" multiple class="hidden">
      <input type="file" id="folderInput" webkitdirectory class="hidden">
      <ul class="files" id="sendList"></ul>
      <p class="sub" id="sendTotal"></p>
      <button class="btn" id="createBtn" type="button" disabled><span data-i18n="createLink"></span></button>
      <div style="margin-top:10px">
        <button class="btn ghost small" id="shareToolBtn" type="button"><span data-i18n="shareTool"></span></button>
      </div>
    </div>

    <div class="card hidden" id="shareCard">
      <h2 class="sec" data-i18n="linkReady"></h2>
      <div class="rowline">
        <div class="grow"><input class="linkbox" id="shareLink" readonly></div>
        <button class="btn small" id="copyBtn" type="button"><span data-i18n="copyLink"></span></button>
      </div>
      <div class="rowline" style="margin-top:8px">
        <button class="btn ghost small" id="waBtn" type="button"><span data-i18n="shareWa"></span></button>
      </div>
      <div class="qrbox" id="qrBox"></div>
      <p class="sub" data-i18n="qrHint" style="text-align:center;margin:2px 0 0"></p>
      <p class="status" id="sendStatus"></p>
      <span class="badge ok hidden" id="wifiBadgeS" data-i18n="wifiBadge" style="margin-bottom:6px"></span>
      <p class="sub" data-i18n="keepOpen"></p>
      <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
        <label class="sub" for="pinSet" data-i18n="pinSetLabel" style="font-weight:600"></label>
        <input class="linkbox" id="pinSet" inputmode="numeric" autocomplete="off" maxlength="4" style="margin:6px 0 2px">
        <p class="sub" data-i18n="pinSetHint" style="margin:2px 0 0"></p>
        <label class="rowline" style="margin-top:12px"><input type="checkbox" id="oneShotSet"> <span data-i18n="oneShotLabel"></span></label>
        <p class="sub" data-i18n="oneShotHint" style="margin:2px 0 0"></p>
        <label class="rowline" style="margin-top:12px"><input type="checkbox" id="expireSet"> <span data-i18n="expireLabel"></span></label>
        <p class="sub" data-i18n="expireHint" style="margin:2px 0 0"></p>
        <p class="sub hidden" id="linkTimer" style="margin-top:8px;font-weight:600"></p>
      </div>
      <div id="sendProgress"></div>
      <p class="fmeta" id="sendRate" style="margin-top:6px"></p>
      <div style="margin-top:12px">
        <button class="btn ghost hidden" id="againBtn" type="button"><span data-i18n="sendAgain"></span></button>
      </div>
    </div>
  </section>

  <!-- ============ RECEIVER VIEW ============ -->
  <section id="view-recv" class="hidden">
    <div class="card">
      <h2 class="sec" data-i18n="incomingTitle"></h2>
      <p class="sub" id="recvFrom"></p>
      <div class="err hidden" id="recvErr"></div>
      <ul class="files" id="recvList"></ul>
      <p class="sub" id="recvTotal"></p>
      <div class="warn hidden" id="recvWarn"></div>
      <p class="status" id="recvStatus"></p>
      <span class="badge ok hidden" id="wifiBadgeR" data-i18n="wifiBadge" style="margin-bottom:6px"></span>
      <div class="hidden" id="pinBox" style="margin:10px 0">
        <p class="sub" data-i18n="pinPrompt" style="margin:0 0 6px"></p>
        <div class="rowline">
          <div class="grow"><input class="linkbox" id="pinInput" inputmode="numeric" autocomplete="off" maxlength="4"></div>
          <button class="btn small" id="pinBtn" type="button"><span data-i18n="pinSend"></span></button>
        </div>
        <p class="sub hidden" id="pinErr" style="margin:6px 0 0;color:var(--bad);font-weight:600"></p>
      </div>
      <button class="btn" id="acceptBtn" type="button" disabled><span data-i18n="acceptBtn"></span></button>
      <div id="recvProgress" style="margin-top:10px"></div>
      <p class="fmeta" id="recvRate"></p>
      <div style="margin-top:12px">
        <button class="btn ghost hidden" id="sendBackBtn" type="button"><span data-i18n="sendBack"></span></button>
        <button class="btn ghost hidden" id="doneWaBtn" type="button" style="margin-left:8px"><span data-i18n="doneWaBtn"></span></button>
        <button class="btn ghost hidden" id="reconnectBtn" type="button"><span data-i18n="reconnectBtn"></span></button>
      </div>
    </div>
  </section>

  <!-- ============ DIAGNOSTICS ============ -->
  <div class="card diag">
    <h2 class="sec" data-i18n="diagTitle"></h2>
    <table>
      <tr><td class="k" data-i18n="dState"></td><td class="v" id="dgState">-</td></tr>
      <tr><td class="k" data-i18n="dPreflight"></td><td class="v" id="dgPreflight">-</td></tr>
      <tr><td class="k" data-i18n="dRelay"></td><td class="v" id="dgRelay">-</td></tr>
      <tr><td class="k" data-i18n="dPath"></td><td class="v" id="dgPath">-</td></tr>
      <tr><td class="k" data-i18n="dMoved"></td><td class="v" id="dgMoved">-</td></tr>
      <tr><td class="k" data-i18n="dSpeed"></td><td class="v" id="dgSpeed">-</td></tr>
      <tr><td class="k" data-i18n="dEta"></td><td class="v" id="dgEta">-</td></tr>
      <tr><td class="k" data-i18n="dDur"></td><td class="v" id="dgDur">-</td></tr>
    </table>
    <div style="margin-top:12px">
      <button class="btn ghost small" id="copyTestBtn" type="button"><span data-i18n="copyTest"></span></button>
    </div>
  </div>

  <footer class="foot">
    <span data-i18n="footNote"></span><br>
    <span data-i18n="footTrust"></span><br>
    by ptraaa<br>
    <a href="https://github.com/Ptraaah/zeroserver/releases" target="_blank" rel="noopener" data-i18n="footDownload"></a>
    &middot;
    <a href="https://trakteer.id/adel_putra2" target="_blank" rel="noopener" data-i18n="footSupport"></a>
    <span data-i18n="footSupportNote"></span>
    <div style="margin-top:10px"><iframe src="https://github.com/sponsors/Ptraaah/button" title="Sponsor Ptraaah" height="32" width="114" style="border: 0; border-radius: 6px;"></iframe></div>
  </footer>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,

    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,

    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];

    this.h = new Int32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,

    this.buf = new Uint8Array(64);

    var w = this.w, i;

    }
    for (i = 16; i < 64; i++){
      var x = w[i - 15], y = w[i - 2];
      var s0 = rr(x, 7) ^ rr(x, 18) ^ (x >>> 3);
      var s1 = rr(y, 17) ^ rr(y, 19) ^ (y >>> 10);

    }

    var e = this.h[4], f = this.h[5], g = this.h[6], h = this.h[7];
    for (i = 0; i < 64; i++){
      var S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25);
      var ch = (e & f) ^ (~e & g);
      var t1 = (h + S1 + ch + K[i] + w[i]) | 0;
      var S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22);
      var mj = (a & b) ^ (a & c) ^ (b & c);
      var t2 = (S0 + mj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0;
      d = c; c = b; b = a; a = (t1 + t2) | 0;
    }

    this.h[2] = (this.h[2] + c) | 0; this.h[3] = (this.h[3] + d) | 0;
    this.h[4] = (this.h[4] + e) | 0; this.h[5] = (this.h[5] + f) | 0;
    this.h[6] = (this.h[6] + g) | 0; this.h[7] = (this.h[7] + h) | 0;
  };

    var i = 0;

      var take = Math.min(64 - this.blen, data.length);
      this.buf.set(data.subarray(0, take), this.blen);
      this.blen += take; i += take;
      if (this.blen === 64){ this._process(this.buf, 0); this.blen = 0; }
    }
    while (i + 64 <= data.length){ this._process(data, i); i += 64; }

    if (this.done) throw new Error("hasher already finished");

    if (this.done) throw new Error("hasher already finished");

    var total = this.total;

    var pad = new Uint8Array(padLen + 8);
    pad[0] = 0x80;
    var hi = Math.floor(total / 536870912);       /* (total * 8) / 2^32 */

    pad[n + 2] = (hi >>> 8) & 255;  pad[n + 3] = hi & 255;
    pad[n + 4] = (lo >>> 24) & 255; pad[n + 5] = (lo >>> 16) & 255;
    pad[n + 6] = (lo >>> 8) & 255;  pad[n + 7] = lo & 255;

    for (var i = 0; i < 8; i++){
      var word = this.h[i] >>> 0;
      var hex = word.toString(16);
      while (hex.length < 8) hex = "0" + hex;
      out += hex;
    }
    return out;
  };
  return { Hasher: Hasher };

var Diag = {

  lastSampleAt: 0, lastSampleBytes: 0, speed: 0, success: null, failNote: "",

    this.role = role; this.stateKey = "stateIdle"; this.pathType = null; this.pathDetail = "";
    this.totalBytes = 0; this.movedBytes = 0; this.startAt = 0; this.endAt = 0;
    this.lastSampleAt = 0; this.lastSampleBytes = 0; this.speed = 0; this.success = null;
    this.failNote = ""; this.render();
  },
  render: function(){
    $("dgState").textContent = t(this.stateKey);
    $("dgPath").textContent = this.pathType === null ? t("pathUnknown")
      : (this.pathType === "relay" ? t("pathRelay") : t("pathDirect") + (this.pathDetail ? " (" + this.pathDetail + ")" : ""));
    $("dgMoved").textContent = fmtBytes(this.movedBytes) + (this.totalBytes ? " / " + fmtBytes(this.totalBytes) : "");
    $("dgSpeed").textContent = this.speed > 0 ? fmtBytes(this.speed) + "/s" : "-";
    var remain = this.totalBytes - this.movedBytes;
    $("dgEta").textContent = (this.totalBytes && remain <= 0) ? t("etaDone")
      : (this.speed > 0 && this.totalBytes ? fmtDur(remain / this.speed) : "-");
    var dur = this.startAt ? ((this.endAt || Date.now()) - this.startAt) / 1000 : 0;
    $("dgDur").textContent = this.startAt ? fmtDur(dur) : "-";
    updateWifiBadge();
    renderPreflight();
    renderRateLines();
  },
  sample: function(){
    var now = Date.now();
    if (this.lastSampleAt){
      var dt = (now - this.lastSampleAt) / 1000;
      if (dt >= 0.5){
        var inst = (this.movedBytes - this.lastSampleBytes) / dt;
        this.speed = this.speed ? (this.speed * 0.6 + inst * 0.4) : inst;
        this.lastSampleAt = now; this.lastSampleBytes = this.movedBytes;
      }
    } else { this.lastSampleAt = now; this.lastSampleBytes = this.movedBytes; }
    ratePush();
    this.render();
  },
  summary: function(){
    var dur = this.startAt ? (((this.endAt || Date.now()) - this.startAt) / 1000) : 0;
    var avg = dur > 0 ? this.movedBytes / dur : 0;
    var path = this.pathType === null ? "unknown"
      : (this.pathType === "relay" ? "relay" : "direct" + (this.pathDetail ? " (" + this.pathDetail + ")" : ""));
    var result = this.success === null ? "incomplete" : (this.success ? "success" : "failed" + (this.failNote ? ": " + this.failNote : ""));

      "ZeroServer connection test",
      "Time: " + new Date().toISOString(),
      "Role: " + this.role,
      "Path: " + path,
      "Browser: " + navigator.userAgent,
      "Total size: " + fmtBytes(this.totalBytes) + " (" + this.totalBytes + " bytes)",
      "Transferred: " + fmtBytes(this.movedBytes),
      "Duration: " + (dur ? dur.toFixed(1) + " s" : "-"),
      "Average speed: " + (avg ? fmtBytes(avg) + "/s" : "-"),
      "Result: " + result

  }
};

/* ---------------- live speed + ETA by the progress bars (v1.4) ----
   The diagnostics panel keeps a whole-transfer average; this is a
   rolling window over the last seconds of confirmed bytes, so the
   number by the progress bar reacts when the network speeds up or
   stalls. The window restarts whenever a transfer (re)starts -
   including a resume after a drop - instead of blending the old
   connection's pace into the new one. */
var RATE_WINDOW_MS = 8000;

function rateReset(){

function ratePush(){

function rateNow(){
  var s = Rate.samples, n = s.length;
  if (n < 2) return 0;
  var last = s[n - 1], anchor = s[0], edge = last.at - RATE_WINDOW_MS, i;
  if (edge > anchor.at){
    for (i = 0; i < n - 1; i++){ if (s[i].at <= edge) anchor = s[i]; else break; }
  }
  var dt = (last.at - anchor.at) / 1000;
  if (dt < 1) return 0;
  var r = (last.bytes - anchor.bytes) / dt;
  return r > 0 ? r : 0;
}

  var txt = "";

/* Read the live RTCPeerConnection and classify the chosen ICE path. */
function classifyPath(pc, done){
  if (!pc || !pc.getStats) { done(null, ""); return; }
  pc.getStats().then(function(stats){
    var pair = null, cands = {};
    stats.forEach(function(r){
      if (r.type === "candidate-pair" && (r.state === "succeeded" || r.nominated) && r.selected !== false){
        if (!pair || r.state === "succeeded") pair = r;
      }
      if (r.type === "local-candidate" || r.type === "remote-candidate") cands[r.id] = r;
    });
    if (!pair){ done(null, ""); return; }
    var local = cands[pair.localCandidateId], remote = cands[pair.remoteCandidateId];
    var lt = local ? local.candidateType : "", rt = remote ? remote.candidateType : "";
    if (lt === "relay" || rt === "relay"){ done("relay", "relay"); return; }
    done("direct", lt || rt || "");
  }).catch(function(){ done(null, ""); });
}
function watchPath(pc){
  var tries = 0;

    tries++;
    classifyPath(pc, function(type, detail){
      if (type){ Diag.pathType = type; Diag.pathDetail = detail; Diag.render(); clearInterval(iv); }
      if (tries > 20) clearInterval(iv);
    });
  }, 2000);
}

/* ---------------- pre-flight network check ----------------
   One throwaway RTCPeerConnection gathers ICE candidates with the
   same STUN servers a real transfer would start from. Seeing an srflx
   candidate means the network hands out a public-facing address,
   so direct connections look possible. Host-only means the browser
   never got one, so direct connections look restricted. Relay
   Honest hint, never a gate. The relay itself is fetched below. */
var Preflight = { state: null };   /* null | "open" | "restricted" | "unknown" */
function renderPreflight(){
  var el = $("dgPreflight"); if (!el) return;
  el.textContent = !Preflight.state ? "-" :
    t(Preflight.state === "open" ? "preflightOpen" :
      Preflight.state === "restricted" ? "preflightRestricted" : "preflightUnknown");
}
function preflightProbe(){
  var pc;
  try { pc = new RTCPeerConnection(PEER_OPTS.config); }
  catch (e) { Preflight.state = "unknown"; renderPreflight(); return; }
  var sawSrflx = false, sawHost = false, finished = false;
  function finish(){
    if (finished) return;
    finished = true;
    try { pc.close(); } catch (e) {}
    Preflight.state = sawSrflx ? "open" : (sawHost ? "restricted" : "unknown");
    renderPreflight();
  }
  try {
    pc.createDataChannel("zs-probe");
    pc.onicecandidate = function(ev){
      if (!ev.candidate){ finish(); return; }
      var m = /\btyp (host|srflx|relay)\b/.exec(ev.candidate.candidate || "");
      if (m && m[1] === "srflx") sawSrflx = true;
      if (m && m[1] === "host") sawHost = true;
    };
    pc.createOffer().then(function(offer){
      return pc.setLocalDescription(offer);
    }).catch(function(){ finish(); });
    setTimeout(finish, 4000);
  } catch (e) { finish(); }
}

/* ---------------- TURN relay (v1.3) ----------------
   A tiny worker mints short-lived TURN credentials so connections
   that cannot go direct (different networks, strict NAT, carrier
   CGNAT) can relay instead of failing. Files still flow between the
   two browsers only; the relay forwards encrypted traffic and can
   never read it. If the worker is unreachable, transfers fall back

     ready    receiver -> sender   save target for file i is set
     ack      receiver -> sender   cumulative chunks/bytes for file i
     fileend  sender   -> receiver file i finished, carries sha256
     verdict  receiver -> sender   hash comparison result for file i
     have     receiver -> sender   indexes already verified (sent on reconnect, before accept)
     done     sender   -> receiver everything sent and verified
     bye      either               polite close
   ================================================================ */
function rtcOf(conn){ return (conn && conn.peerConnection) || null; }
function isControlMsg(d){
  return !!d && typeof d === "object" && !(d instanceof ArrayBuffer) &&
         !ArrayBuffer.isView(d) && !(window.Blob && d instanceof Blob) &&
         typeof d.kind === "string";
}
function pct(done, total){ return total > 0 ? Math.min(100, Math.round(done * 100 / total)) : 100; }

/* ---------------- wake lock ----------------
   Keep the screen on while a transfer is active so a phone going
   to sleep cannot cut it. Guarded: the API is not everywhere. */
var WakeLock = {
  lock: null, wanted: false,
  request: function(){
    this.wanted = true;
    if (!("wakeLock" in navigator)) return;
    if (this.lock) return;
    var self = this;
    try {
      navigator.wakeLock.request("screen").then(function(lk){
        self.lock = lk;
        lk.addEventListener("release", function(){ self.lock = null; });
      }).catch(function(){ /* denied or not visible: not fatal */ });
    } catch (e) {}
  },
  release: function(){
    this.wanted = false;
    if (this.lock){
      try { this.lock.release(); } catch (e) {}
      this.lock = null;
    }
  }
};
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "visible" && WakeLock.wanted && !WakeLock.lock){
    WakeLock.request();
  }
});

var ticker = null;
function startTicker(){
  WakeLock.request();
  Diag.endAt = 0; /* a resumed transfer keeps counting duration */
  if (ticker) return;
  ticker = setInterval(function(){ Diag.sample(); }, 500);
}
function stopTicker(){
  WakeLock.release();
  if (ticker){ clearInterval(ticker); ticker = null; }
  Diag.endAt = Date.now(); Diag.sample();
}

var S = {
  files: [], peer: null, conn: null, link: "",
  ackedFile: 0, sentFile: 0, ackedTotal: 0,
  waiters: {}, rows: [], active: false, dead: false, finished: false,
  createdAt: 0, servedOnce: false
};
/* ---- link controls: optional PIN, one-shot, 30-minute expiry ----
   All off by default, read live from the share-card controls, so
   they can be set right after the link is created. */
function sPin(){
  var el = $("pinSet"); if (!el) return "";
  var v = (el.value || "").replace(/\D/g, "");
  return v.length === 4 ? v : "";
}
function sOneShotOn(){ var el = $("oneShotSet"); return !!(el && el.checked); }
function sExpireOn(){ var el = $("expireSet"); return !!(el && el.checked); }
function sLinkClosed(){
  if (sOneShotOn() && S.servedOnce) return true;
  if (sExpireOn() && S.createdAt && Date.now() > S.createdAt + 30 * 60 * 1000) return true;
  return false;
}
function fmtClock(ms){
  var s = Math.max(0, Math.ceil(ms / 1000));
  var m = Math.floor(s / 60), ss = s % 60;
  return m + ":" + (ss < 10 ? "0" : "") + ss;
}
function updateLinkTimer(){
  var el = $("linkTimer"); if (!el) return;
  if (!S.createdAt || !sExpireOn()){ el.classList.add("hidden"); return; }
  var left = S.createdAt + 30 * 60 * 1000 - Date.now();
  el.classList.remove("hidden");
  el.textContent = left > 0 ? t("linkExpiresIn") + " " + fmtClock(left) : t("linkExpiredNote");
}
$("pinSet").addEventListener("input", function(){
  this.value = this.value.replace(/\D/g, "").slice(0, 4);
});
function sMeta(){
  var out = [];
  for (var i = 0; i < S.files.length; i++){
    var f = S.files[i];
    out.push({ name: f.name, size: f.size, type: f.type || "", totalChunks: Math.ceil(f.size / CHUNK) });
  }
  return out;
}
function sTotalSize(){
  var n = 0; for (var i = 0; i < S.files.length; i++) n += S.files[i].size;
  return n;
}
function renderSendList(){
  var ul = $("sendList"); ul.innerHTML = "";

    var mt = document.createElement("div"); mt.className = "fmeta"; mt.textContent = fmtBytes(f.size);

  $("createBtn").disabled = !S.files.length || S.active;
}
function addSendFiles(list){

}

function sRowUpdate(i, doneBytes, state){
  var r = S.rows[i]; if (!r) return;
  var size = S.files[i].size;
  r.bar.style.width = pct(doneBytes, size) + "%";
  r.meta.textContent = fmtBytes(Math.min(doneBytes, size)) + " / " + fmtBytes(size);
  if (state === "active"){ r.badge.className = "badge wait"; r.badge.textContent = t("activeBadge"); }
  if (state === "ok"){ r.badge.className = "badge ok"; r.badge.textContent = t("verified"); }
  if (state === "bad"){ r.badge.className = "badge bad"; r.badge.textContent = t("failedBadge"); }
}
function sWait(key){
  return new Promise(function(res, rej){ S.waiters[key] = { res: res, rej: rej }; });
}
function sResolve(key, val){
  var w = S.waiters[key]; if (w){ delete S.waiters[key]; w.res(val); }
}
function sFailAll(err){
  for (var k in S.waiters){ S.waiters[k].rej(err); }
  S.waiters = {};
}
function sDie(note){
  if (S.dead) return;
  S.dead = true; stopTicker();
  Diag.success = false; Diag.failNote = note || "";
  Diag.stateKey = "stateFailed"; Diag.render();
  sFailAll(new Error(note || "closed"));
}
function sDisconnect(){
  /* The receiver went away mid-transfer. Do NOT destroy the peer:
     the link stays valid, the receiver can reconnect to the same id
     and resume; files it already verified are skipped via "have". */
  S.conn = null;
  stopTicker();
  sFailAll(new Error("closed"));
  Diag.stateKey = "stateWaiting"; Diag.render();
  $("sendStatus").textContent = t("waitingPeer");
  $("againBtn").classList.add("hidden");
}
$("createBtn").addEventListener("click", function(){
  if (!S.files.length || S.active) return;
  if (!ICE_READY) { ensureIce().then(function(){ $("createBtn").click(); }); return; }
  S.active = true; renderSendList();
  $("pickBtn").disabled = true; $("createBtn").disabled = true;
  Diag.reset(t("summaryRoleSend"));
  Diag.totalBytes = sTotalSize(); Diag.render();
  var peer = new Peer(newPeerId(), PEER_OPTS);
  S.peer = peer;
  peer.on("open", function(id){
    S.link = location.href.split("#")[0] + "#/r/" + id;
    $("shareLink").value = S.link;

    S._timerIv = setInterval(updateLinkTimer, 1000);
    updateLinkTimer();
  });
  peer.on("connection", function(conn){
    if (sLinkClosed()){ try { conn.close(); } catch (e) {} return; }
    if (S.conn && S.conn.open){ try { conn.close(); } catch (e) {} return; }
    if (S.conn) sDisconnect(); /* stale half-dead connection: reset, take the new one */
    S.conn = conn; wireSenderConn(conn);
  });
  peer.on("error", function(err){
    if (err && err.type === "unavailable-id" && !S.conn) return; /* broker hiccup; link may still work */
    $("sendStatus").textContent = t("errGeneric");
    sDie(err && err.type ? err.type : "peer error");
  });
});
$("copyBtn").addEventListener("click", function(){ copyText(S.link, t("copied")); });
$("waBtn").addEventListener("click", function(){

$("againBtn").addEventListener("click", function(){

function wireSenderConn(conn){
  conn.on("open", function(){
    $("sendStatus").textContent = t("connected");
    Diag.stateKey = "stateConnecting"; Diag.render();
    watchPath(rtcOf(conn));
  });
  conn.on("data", function(data){
    if (!isControlMsg(data)) return;
    if (data.kind === "hello"){
      if (sLinkClosed()){ try { conn.close(); } catch (e) {} return; }
      var want = sPin();
      if (want){
        var attempt = data.pin || "";
        if (attempt !== want){
          if (attempt) conn._pinTries = (conn._pinTries || 0) + 1;
          var left = 3 - (conn._pinTries || 0);
          if (left <= 0){
            try { conn.send({ kind: "pinerror", triesLeft: 0 }); } catch (e) {}
            try { conn.close(); } catch (e) {}
            return;
          }
          /* no attempt yet: ask. wrong attempt: say so. meta waits. */
          conn.send(attempt ? { kind: "pinerror", triesLeft: left } : { kind: "pinreq" });
          return;
        }
      }
      conn.send({ kind: "meta", files: sMeta() });
    } else if (data.kind === "have"){
      conn._have = data.indexes || [];
    } else if (data.kind === "accept"){
      sResolve("accept", true);
    } else if (data.kind === "ready"){
      sResolve("ready:" + data.index, true);
    } else if (data.kind === "ack"){
      S.ackedFile = Math.max(S.ackedFile, data.bytes || 0);
      S.ackedTotal = Math.min(sTotalSize(), ackedThrough(data.index) );
      Diag.movedBytes = S.ackedTotal; Diag.sample();
    } else if (data.kind === "verdict"){
      sResolve("verdict:" + data.index, data);
    }
  });
  conn.on("close", function(){
    if (S.conn !== conn) return;
    if (S.finished || Diag.success) return;
    sDisconnect();
  });
  conn.on("error", function(){
    if (S.conn !== conn) return;
    if (S.finished || Diag.success) return;
    sDisconnect();
  });
  sWait("accept").then(function(){
    Diag.stateKey = "stateTransfer"; Diag.startAt = Date.now(); Diag.lastSampleAt = 0; Diag.render();
    rateReset();
    startTicker();
    return runSend(conn);
  }).catch(function(){ /* closed or failed; handled in sDie */ });
}
function ackedThrough(idx){
  var n = S.ackedFile;
  for (var i = 0; i < idx && i < S.files.length; i++) n += S.files[i].size;
  return n;
}
function runSend(conn){
  /* Resume: files the receiver already verified are skipped entirely. */
  var have = {};
  (conn._have || []).forEach(function(ix){ have[ix] = true; });
  var base = 0;
  for (var i = 0; i < S.files.length; i++){
    if (have[i]){ base += S.files[i].size; sRowUpdate(i, S.files[i].size, "ok"); }
  }
  if (base > 0){ Diag.movedBytes = base; Diag.render(); }
  var chain = Promise.resolve();
  S.files.forEach(function(file, i){
    chain = chain.then(function(){
      if (have[i]) return;
      return streamFile(conn, file, i);
    });
  });
  return chain.then(function(){
    conn.send({ kind: "done" });
    stopTicker();
    Diag.success = true; Diag.stateKey = "stateDone"; Diag.render();
    S.dead = true; S.finished = true;
    $("sendStatus").textContent = t("doneOk");
    if (sOneShotOn()){
      S.servedOnce = true;
      $("sendStatus").textContent = t("doneOk") + " " + t("linkUsedUp");
    }
    $("againBtn").classList.remove("hidden");
  }).catch(function(err){
    if (S.conn !== conn) return; /* disconnected; sDisconnect already reset the UI */
    if (!S.dead) sDie(err && err.message ? err.message : "failed");
  });
}
function streamFile(conn, file, idx){
  S.ackedFile = 0; S.sentFile = 0;
  sRowUpdate(idx, 0, "active");
  return sWait("ready:" + idx).then(function(){
    var hasher = new SHA256.Hasher();
    var offset = 0;
    function windowFull(){
      var dc = underlyingDC(conn);
      var buffered = dc ? dc.bufferedAmount : 0;
      return (S.sentFile - S.ackedFile) > WINDOW_BYTES || buffered > WINDOW_BYTES;
    }
    function step(){
      if (S.dead) return Promise.reject(new Error("closed"));
      if (S.conn !== conn) return Promise.reject(new Error("closed"));
      if (offset >= file.size){
        var hex = hasher.digestHex();
        conn.send({ kind: "fileend", index: idx, sha256: hex });
        return sWait("verdict:" + idx).then(function(v){
          if (v && v.ok){ sRowUpdate(idx, file.size, "ok"); return; }
          sRowUpdate(idx, S.ackedFile, "bad");
          $("sendStatus").textContent = t("mismatch");
          throw new Error("hash mismatch");
        });
      }
      if (windowFull()) return sleep(40).then(step);
      var end = Math.min(offset + CHUNK, file.size);
      return file.slice(offset, end).arrayBuffer().then(function(buf){
        hasher.update(new Uint8Array(buf));
        conn.send(buf);
        offset = end; S.sentFile = offset;
        return step();
      });
    }
    return step();
  });
}

/* ================================================================
   RECEIVER
   ================================================================ */
var R = {
  peer: null, conn: null, files: [], handles: [], modes: [],
  cur: -1, hasher: null, writable: null, memParts: [], recvBytes: 0,
  chain: Promise.resolve(), dead: false, accepted: false,
  have: {}, peerId: null, gotMeta: false, everAccepted: false, gen: 0,
  pin: "", opfsRoot: null, opfsNames: [], opfsHandles: []
};
var HAS_FS = typeof window.showSaveFilePicker === "function";
var HAS_OPFS = !!(navigator.storage && navigator.storage.getDirectory);

/* ---------------- OPFS receive sink ----------------
   When neither FS Access nor a user-picked file is available, chunks
   stream into the browser's origin-private storage instead of RAM,
   so Firefox/Safari can receive files far bigger than memory. The
   temp files all carry a "zs-" prefix and are cleaned up after the
   download is offered; leftovers are swept on the next visit. */
function opfsOpen(i){
  return navigator.storage.getDirectory().then(function(root){
    R.opfsRoot = root;
    if (!R.opfsNames[i]) R.opfsNames[i] = "zs-" + Date.now() + "-" + i;
    return root.getFileHandle(R.opfsNames[i], { create: true });
  }).then(function(fh){
    R.opfsHandles[i] = fh;
    return fh.createWritable();
  }).then(function(w){ R.writable = w; });
}
function opfsDiscard(i){
  if (!R.opfsRoot || !R.opfsNames[i]) return;
  var name = R.opfsNames[i]; R.opfsNames[i] = null;
  R.opfsRoot.removeEntry(name).catch(function(){});
}
function opfsSweep(){
  if (!HAS_OPFS) return;
  try {
    navigator.storage.getDirectory().then(function(root){
      R.opfsRoot = root;
      if (!root.values) return;
      var it = root.values();
      (function step(){
        it.next().then(function(r){
          if (r.done) return;
          var h = r.value;
          if (h && h.kind === "file" && h.name.indexOf("zs-") === 0){
            root.removeEntry(h.name).then(step, step);
          } else step();
        }).catch(function(){});
      })();
    }).catch(function(){});
  } catch (e) {}
}
function renderRecvList(){
  var ul = $("recvList"); ul.innerHTML = "";
  for (var i = 0; i < R.files.length; i++){
    var f = R.files[i], li = document.createElement("li");
    var nm = document.createElement("div"); nm.className = "fname"; nm.textContent = f.name;
    var badge = document.createElement("span"); badge.className = "badge wait"; badge.textContent = t("pendingBadge");
    badge.id = "rbadge" + i; nm.appendChild(badge);
    var mt = document.createElement("div"); mt.className = "fmeta"; mt.textContent = fmtBytes(f.size);
    var barWrap = document.createElement("div"); barWrap.className = "bar";
    var bar = document.createElement("div"); bar.id = "rbar" + i; barWrap.appendChild(bar);
    li.appendChild(nm); li.appendChild(mt); li.appendChild(barWrap);
    var dl = document.createElement("div"); dl.id = "rdl" + i; li.appendChild(dl);
    ul.appendChild(li);
  }
  var total = 0; for (var j = 0; j < R.files.length; j++) total += R.files[j].size;
  $("recvTotal").textContent = R.files.length
    ? R.files.length + " " + t("totalFiles") + " - " + fmtBytes(total) : "";
}
function rBadge(i, state){
  var b = $("rbadge" + i); if (!b) return;
  if (state === "active"){ b.className = "badge wait"; b.textContent = t("activeBadge"); }
  if (state === "ok"){ b.className = "badge ok"; b.textContent = t("verified"); }
  if (state === "bad"){ b.className = "badge bad"; b.textContent = t("failedBadge"); }
}
function rBar(i, doneBytes){
  var b = $("rbar" + i); if (!b) return;
  b.style.width = pct(doneBytes, R.files[i].size) + "%";
}
function rDie(note, msgKey){
  if (R.dead) return;
  R.dead = true; stopTicker();
  Diag.success = false; Diag.failNote = note || "";
  Diag.stateKey = "stateFailed"; Diag.render();
  var box = $("recvErr"); box.textContent = t(msgKey || "errGeneric");
  box.classList.remove("hidden");
}
function initReceiver(peerId){
  $("view-send").classList.add("hidden");
  $("view-recv").classList.remove("hidden");
  $("recvFrom").textContent = t("fromPeer");
  Diag.reset(t("summaryRoleRecv"));
  R.peerId = peerId;
  opfsSweep();
  rConnect();
}
function rConnect(){
  if (!ICE_READY) { ensureIce().then(function(){ rConnect(); }); return; }
  $("recvStatus").textContent = t("connecting");
  Diag.stateKey = "stateConnecting"; Diag.render();
  var peer = new Peer(PEER_OPTS);
  R.peer = peer;
  peer.on("open", function(){
    var conn = peer.connect(R.peerId, { reliable: true });
    R.conn = conn; wireRecvConn(conn);
  });
  peer.on("error", function(err){
    if (err && err.type === "peer-unavailable"){
      if (R.gotMeta) enterLostState();
      else rDie("sender unreachable", "errNoPeer");
    }
    else rDie(err && err.type ? err.type : "peer error", "errGeneric");
  });
}
function enterLostState(){
  /* Connection dropped. Keep the completed-file set and the save
     handles, drop the half-written current file, offer reconnect. */
  R.gen++;
  R.chain = Promise.resolve();
  R.conn = null;
  stopTicker();
  if (R.writable){
    try { R.writable.abort(); } catch (e) {}
    R.writable = null;
  }
  R.memParts = [];
  if (R.cur >= 0 && R.modes[R.cur] === "opfs") opfsDiscard(R.cur);
  $("pinBox").classList.add("hidden");
  Diag.stateKey = "stateFailed"; Diag.render();
  $("recvStatus").textContent = t("connLost");
  $("reconnectBtn").classList.remove("hidden");
}
$("reconnectBtn").addEventListener("click", function(){
  $("reconnectBtn").classList.add("hidden");
  if (R.peer){ try { R.peer.destroy(); } catch (e) {} R.peer = null; }
  rConnect();
});
function resumeReceive(){
  /* Reconnect after a drop: the save targets from the first accept
     are still stored, so no new gesture or picking is needed. */
  $("acceptBtn").disabled = true;
  Diag.stateKey = "stateTransfer"; Diag.render();
  rateReset();
  startTicker();
  $("recvStatus").textContent = t("receiving");
  R.conn.send({ kind: "accept" });
  var start = 0;
  while (start < R.files.length && R.have[start]) start++;
  if (start < R.files.length) beginFile(start);
}
function wireRecvConn(conn){
  conn.on("open", function(){
    $("recvStatus").textContent = t("receivingWait");
    watchPath(rtcOf(conn));
    conn.send({ kind: "hello", pin: R.pin || "" });
  });
  conn.on("data", function(data){
    if (R.conn !== conn) return;
    if (isControlMsg(data)){
      if (data.kind === "pinreq") onPinReq();
      else if (data.kind === "pinerror") onPinErr(data);
      else if (data.kind === "meta") onMeta(data);
      else if (data.kind === "fileend") enqueue(function(){ return finishFile(data); });
      else if (data.kind === "done") onAllDone();
      return;
    }
    enqueue(function(){ return takeChunk(data); });
  });
  conn.on("close", function(){
    if (R.conn !== conn) return;
    if (R.dead || Diag.success === true) return;
    enterLostState();
  });
  conn.on("error", function(){
    if (R.conn !== conn) return;
    if (R.dead || Diag.success === true) return;
    enterLostState();
  });
}
function enqueue(fn){
  var gen = R.gen;
  R.chain = R.chain.then(function(){
    if (gen !== R.gen) return; /* stale work from a dead connection */
    return fn();
  }).catch(function(e){ rDie(e && e.message ? e.message : "error", "errGeneric"); });
}
function onPinReq(){
  /* A PIN we already entered (e.g. before a reconnect) is resent
     automatically; otherwise ask the user. */
  if (R.pin){ if (R.conn) R.conn.send({ kind: "hello", pin: R.pin }); return; }
  $("pinBox").classList.remove("hidden");
  $("recvStatus").textContent = t("pinPrompt");
}
function onPinErr(data){
  R.pin = "";
  $("pinBox").classList.remove("hidden");
  var e = $("pinErr");
  e.textContent = t("pinWrong") + " " + (data.triesLeft != null ? data.triesLeft : "") + " " + t("pinTries");
  e.classList.remove("hidden");
  $("recvStatus").textContent = t("pinPrompt");
}
$("pinBtn").addEventListener("click", function(){
  var v = ($("pinInput").value || "").replace(/\D/g, "");
  if (v.length !== 4) return;
  R.pin = v;
  $("pinErr").classList.add("hidden");
  $("pinBox").classList.add("hidden");
  $("recvStatus").textContent = t("receivingWait");
  if (R.conn) R.conn.send({ kind: "hello", pin: v });
});
$("pinInput").addEventListener("input", function(){
  this.value = this.value.replace(/\D/g, "").slice(0, 4);
});
function onMeta(data){
  R.files = data.files || [];
  R.gotMeta = true;
  $("pinBox").classList.add("hidden");
  $("pinErr").classList.add("hidden");
  var total = 0, big = false, i;
  for (i = 0; i < R.files.length; i++){ total += R.files[i].size; if (R.files[i].size > BIG_FILE) big = true; }
  Diag.totalBytes = total; Diag.render();
  renderRecvList();
  /* files verified in an earlier connection keep their badges */
  for (var k in R.have){ rBadge(+k, "ok"); rBar(+k, R.files[+k] ? R.files[+k].size : 0); }
  if (big && !HAS_FS && !HAS_OPFS){
    var w = $("recvWarn"); w.textContent = t("warnBig"); w.classList.remove("hidden");
  }
  if (R.everAccepted){
    /* reconnect: tell the sender what we already have, then resume */
    var idxs = [];
    for (var j in R.have) idxs.push(+j);
    if (idxs.length) R.conn.send({ kind: "have", indexes: idxs });
    resumeReceive();
    return;
  }
  $("recvStatus").textContent = t("senderReady");
  $("acceptBtn").disabled = false;
}
$("acceptBtn").addEventListener("click", function(){
  if (R.accepted || !R.files.length) return;
  R.accepted = true; R.everAccepted = true;
  $("acceptBtn").disabled = true;
  prepareAll().then(function(){
    Diag.stateKey = "stateTransfer"; Diag.startAt = Date.now(); Diag.lastSampleAt = 0; Diag.render();
    rateReset();
    startTicker();
    $("recvStatus").textContent = t("receiving");
    R.conn.send({ kind: "accept" });
    return beginFile(0);
  }).catch(function(){
    /* user cancelled a save dialog: let them press accept again */
    R.accepted = false; $("acceptBtn").disabled = false;
    $("recvStatus").textContent = t("senderReady");
  });
});
function prepareAll(){
  /* Ask for every save location up front, inside the accept tap,
     so later files never need a fresh user gesture. */
  var chain = Promise.resolve();
  if (!HAS_FS){
    var sink = HAS_OPFS ? "opfs" : "mem";
    R.files.forEach(function(f, i){ R.modes[i] = sink; });
    return chain;
  }
  R.files.forEach(function(f, i){
    chain = chain.then(function(){
      $("recvStatus").textContent = t("pickSave") + " " + f.name;
      return window.showSaveFilePicker({ suggestedName: f.name }).then(function(h){
        R.handles[i] = h; R.modes[i] = "fs";
      }).catch(function(err){
        if (err && err.name === "AbortError") throw err;
        R.modes[i] = "mem"; /* picker blocked for this one: fall back */
      });
    });
  });
  return chain;
}
function beginFile(i){
  R.cur = i; R.recvBytes = 0; R.memParts = [];
  R.hasher = new SHA256.Hasher();
  rBadge(i, "active");
  var openWrite;
  if (R.modes[i] === "fs" && R.handles[i]){
    openWrite = R.handles[i].createWritable().then(function(w){ R.writable = w; });
  } else if (R.modes[i] === "opfs"){
    openWrite = opfsOpen(i).catch(function(){
      R.modes[i] = "mem"; R.writable = null; /* OPFS failed: RAM is the last resort */
    });
  } else {
    openWrite = Promise.resolve();
  }
  return openWrite.then(function(){ R.conn.send({ kind: "ready", index: i }); });
}
function takeChunk(data){
  if (R.cur < 0) return Promise.resolve();
  var toU8 = (data instanceof ArrayBuffer) ? Promise.resolve(new Uint8Array(data))
    : (window.Blob && data instanceof Blob) ? data.arrayBuffer().then(function(b){ return new Uint8Array(b); })
    : Promise.resolve(new Uint8Array(data));
  return toU8.then(function(u8){
    R.hasher.update(u8);
    R.recvBytes += u8.length;
    Diag.movedBytes = movedThrough(R.cur);
    Diag.sample();
    rBar(R.cur, R.recvBytes);
    var writing = R.writable ? R.writable.write(u8) : (R.memParts.push(u8), Promise.resolve());
    var chunksDone = Math.round(R.recvBytes / CHUNK);
    if (chunksDone > 0 && chunksDone % ACK_EVERY === 0){
      R.conn.send({ kind: "ack", index: R.cur, chunks: chunksDone, bytes: R.recvBytes });
    }
    return writing;
  });
}
function movedThrough(idx){
  var n = R.recvBytes;
  for (var i = 0; i < idx && i < R.files.length; i++) n += R.files[i].size;
  return n;
}
function finishFile(msg){
  var i = msg.index, f = R.files[i];
  if (!f || i !== R.cur) return Promise.resolve();
  var closeIt = R.writable ? R.writable.close() : Promise.resolve();
  R.writable = null;
  return closeIt.then(function(){
    var hex = R.hasher.digestHex();
    var ok = (hex === msg.sha256);
    /* make sure the sender window sees full receipt before the verdict */
    R.conn.send({ kind: "ack", index: i, chunks: f.totalChunks, bytes: f.size });
    R.conn.send({ kind: "verdict", index: i, ok: ok });
    if (ok){
      R.have[i] = true;
      rBadge(i, "ok"); rBar(i, f.size);
      if (R.modes[i] === "mem") offerDownload(i);
      else if (R.modes[i] === "opfs") offerDownloadOpfs(i);
      if (i + 1 < R.files.length) return beginFile(i + 1);
    } else {
      rBadge(i, "bad");
      if (R.modes[i] === "opfs") opfsDiscard(i); /* never keep a corrupt file */
      var box = $("recvErr"); box.textContent = t("mismatch"); box.classList.remove("hidden");
      rDie("hash mismatch", "errGeneric"); $("recvErr").textContent = t("mismatch");
    }
  });
}
function showDownload(i, url){
  var f = R.files[i];
  var host = $("rdl" + i); if (!host) return;
  var a = document.createElement("a");
  a.href = url; a.download = f.name; a.className = "btn ghost small dlbtn";
  a.style.display = "inline-block"; a.style.textDecoration = "none";
  a.textContent = "Download: " + f.name;
  host.appendChild(a);
  /* nudge an automatic download too; the button stays as fallback */
  var ghost = document.createElement("a");
  ghost.href = url; ghost.download = f.name;
  document.body.appendChild(ghost); ghost.click();
  document.body.removeChild(ghost);
}
function offerDownload(i){
  var f = R.files[i];
  var blob = new Blob(R.memParts, { type: f.type || "application/octet-stream" });
  R.memParts = [];
  showDownload(i, URL.createObjectURL(blob));
}
function offerDownloadOpfs(i){
  var fh = R.opfsHandles[i]; if (!fh) return;
  fh.getFile().then(function(file){
    var url = URL.createObjectURL(file);
    showDownload(i, url);
    /* The download reads from the OPFS file via this URL, so give it
       plenty of time before revoking and removing the temp copy. */
    setTimeout(function(){ URL.revokeObjectURL(url); opfsDiscard(i); }, 10 * 60 * 1000);
  }).catch(function(){});
}
function onAllDone(){
  stopTicker();
  Diag.success = true; Diag.stateKey = "stateDone"; Diag.render();
  R.dead = true;
  $("recvStatus").textContent = t("doneRecv");
  $("sendBackBtn").classList.remove("hidden");
  var allOk = R.files.length > 0;
  for (var i = 0; i < R.files.length; i++){ if (!R.have[i]) allOk = false; }
  if (allOk) $("doneWaBtn").classList.remove("hidden");
}
$("sendBackBtn").addEventListener("click", function(){
  location.href = location.href.split("#")[0];
});
$("doneWaBtn").addEventListener("click", function(){
  var names = [], total = 0, i;
  for (i = 0; i < R.files.length; i++){ names.push(R.files[i].name); total += R.files[i].size; }
  var list = names.join(", ");
  if (list.length > 180) list = list.slice(0, 177) + "...";
  var msg = t("doneWaText").replace("{files}", list).replace("{size}", fmtBytes(total));
  window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
});

/* ---------------- boot ---------------- */
applyI18n();
Diag.render();
var routeMatch = location.hash.match(/^#\/r\/(.+)$/);
if (routeMatch) initReceiver(decodeURIComponent(routeMatch[1]));
else { renderSendList(); ensureIce(); preflightProbe(); }
</script>
</body>
